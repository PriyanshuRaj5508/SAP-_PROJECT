<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP S/4HANA Cloud – Plant Maintenance & Asset Lifecycle Management</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
</head>
<body>
  <div id="app">
    <!-- Shell Bar -->
    <header class="shell-bar" id="shell-bar">
      <div class="shell-left">
        <button class="shell-menu-btn" id="sidenavToggle" title="Navigation Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="shell-logo">SAP</div>
        <div class="shell-divider"></div>
        <div class="shell-app-name">
          <span class="app-name-main">S/4HANA Cloud</span>
          <span class="app-name-sub">Plant Maintenance &amp; Asset Lifecycle</span>
        </div>
      </div>
      <div class="shell-right">
        <span class="shell-info">Plant: 1000 — Hamburg</span>
        <span class="shell-divider-v"></span>
        <span class="shell-info">FY 2026 | Period 4</span>
        <span class="shell-divider-v"></span>
        <button class="shell-icon-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </button>
        <button class="shell-icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="shell-user" id="userMenu">
          <div class="avatar">AM</div>
          <span class="user-name">A. Martand</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- Side Navigation -->
    <aside class="sidenav" id="sidenav">
      <div class="sidenav-inner">
        <nav class="sidenav-nav">
          <div class="sidenav-group">
            <div class="sidenav-group-title">MAIN NAVIGATION</div>
            <a class="sidenav-item active" data-tab="home" onclick="switchTab('home')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Home</span>
            </a>
            <a class="sidenav-item" data-tab="assets" onclick="switchTab('assets')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>Equipment Register</span>
            </a>
            <a class="sidenav-item" data-tab="orders" onclick="switchTab('orders')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              <span>Maintenance Orders</span>
              <span class="nav-badge">2</span>
            </a>
            <a class="sidenav-item" data-tab="inspection" onclick="switchTab('inspection')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <span>Inspection Plans</span>
              <span class="nav-badge warn">1</span>
            </a>
            <a class="sidenav-item" data-tab="costs" onclick="switchTab('costs')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <span>Cost Analysis</span>
            </a>
            <a class="sidenav-item" data-tab="report" onclick="switchTab('report')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span>Reporting</span>
            </a>
          </div>
          <div class="sidenav-group">
            <div class="sidenav-group-title">SYSTEM</div>
            <a class="sidenav-item" onclick="showToast('Opening SAP Help Portal...', 'info')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span>Help &amp; Support</span>
            </a>
          </div>
        </nav>
        <div class="sidenav-footer">
          <div class="sidenav-footer-text">SAP S/4HANA Cloud Trial</div>
          <div class="sidenav-footer-sub">v2026.04.1</div>
        </div>
      </div>
    </aside>

    <!-- Tab Bar -->
    <div class="sub-bar" id="sub-bar">
      <button class="tab active" data-tab="home" onclick="switchTab('home')">Home</button>
      <button class="tab" data-tab="assets" onclick="switchTab('assets')">Equipment Register</button>
      <button class="tab" data-tab="orders" onclick="switchTab('orders')">Maintenance Orders</button>
      <button class="tab" data-tab="inspection" onclick="switchTab('inspection')">Inspection Plans</button>
      <button class="tab" data-tab="costs" onclick="switchTab('costs')">Cost Analysis</button>
      <button class="tab" data-tab="report" onclick="switchTab('report')">Reporting</button>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="content-inner" id="content"></div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <div class="modal-hdr">
        <span class="modal-title" id="modal-title"></span>
        <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveModal()">Save &amp; Release</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="src/data/mockData.js"></script>
  <script src="src/components/utils.js"></script>
  <script src="src/components/home.js"></script>
  <script src="src/components/assets.js"></script>
  <script src="src/components/orders.js"></script>
  <script src="src/components/inspection.js"></script>
  <script src="src/components/costs.js"></script>
  <script src="src/components/report.js"></script>
  <script src="src/components/modals.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
